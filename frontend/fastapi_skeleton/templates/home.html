{% extends "base.html" %}

{% block title %}Home - Bike Detector{% endblock %}

{% block content %}
<style>
    .hero {
        position: relative;
        width: 100%;
        height: 100vh; /* Full viewport height */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        text-align: center;
        color: white;
    }

    .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensures the full image is visible without cropping */
        filter: brightness(50%);
    }

    .hero-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 2.5rem;
        font-family: 'Poppins', sans-serif; /* Modern font */
        font-weight: 600;
    }

    .hero-text h1 {
        margin: 0;
        font-size: 4rem;
        letter-spacing: 1px;
    }

    .hero-text p {
        margin-top: 10px;
        font-size: 2rem;
        font-weight: 300;
    }
</style>

<!-- Ensure the image is in static/images/frontpage.jpg -->
<div class="hero">
    <img src="/static/frontpage.jpg" alt="Bike Detector">
    <div class="hero-text">
        <h1>THE BIKE DETECTOR.</h1>
        <p>Measuring Bike Usage in Cambridge, MA</p>
    </div>
</div>

{% endblock %}
