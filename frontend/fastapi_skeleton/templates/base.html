<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='home.css') }}?v=1.2">
    <title>{% block title %}Bike Detector{% endblock %}</title>
</head>
<body>
  <nav>
    <div class="nav-header">
      <label class="logo">The Bike Detector</label>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
  
    <ul id="nav-menu">
      <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('map_page') }}">Detector Map</a></li>
      <li><a href="{{ url_for('bikedata') }}">Bike Data</a></li>
      <li><a href="{{ url_for('monitordata') }}">Monitor Data</a></li>
      <li><a href="{{ url_for('contact') }}">Contact</a></li>
    </ul>
  
    <div class="profile">
      <a href="{{ url_for('log_in') }}">Register a Device</a>
    </div>
  </nav>
      <script>
        function toggleMenu() {
          const menu = document.getElementById('nav-menu');
          menu.classList.toggle('show');
        }
      </script>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
