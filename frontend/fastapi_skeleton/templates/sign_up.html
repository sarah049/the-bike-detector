{% extends "base.html" %}

{% block title %}Sign Up - The Bike Detector{% endblock %}

{% block content %}
    <div id="card">
        <div id="card-content">
            <div id="card-title">
                <h2>SIGN UP</h2>
            </div>
            <form method="post" class="form">
                <label for="user-email" style="padding-top:13px">&nbsp;Email</label>
                <input id="user-email" class="form-content" type="email" name="email" required />
                <div class="form-border"></div>

                <label for="user-password" style="padding-top:22px">&nbsp;Password</label>
                <input id="user-password" class="form-content" type="password" name="password" required />
                <div class="form-border"></div>

                <label for="user-sign-up-code" style="padding-top:22px">&nbsp;Sign up code</label>
                <input id="user-sign-up-code" class="form-content" type="text" required />
                <div class="form-border"></div>

                <input id="submit-btn" type="submit" name="submit" value="SIGN UP" />
                <a href="{{ url_for('log_in') }}" id="signup" class="signButton">Have an account? Sign in</a>
            </form>
        </div>
    </div>
{% endblock %}
