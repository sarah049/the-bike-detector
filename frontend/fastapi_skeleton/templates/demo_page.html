    <script>


        ///////////////////////////////

                    // Global variable for URL parameters
                    document.addEventListener("DOMContentLoaded", function() {
                // Initialize URL parameters
                    urlParams = new URLSearchParams(window.location.search);
                    
                    // Initialize all dropdowns
                    document.querySelectorAll('.dropdown').forEach(dropdown => {
                        let button = dropdown.querySelector('button');
                        let content = dropdown.querySelector('.dropdown-content');

                        button.addEventListener('click', function() {
                            // Toggle the display of this dropdown
                            content.style.display = (content.style.display === 'none' || content.style.display === '') ? 'block' : 'none';

                            // Close other dropdowns
                            document.querySelectorAll('.dropdown .dropdown-content').forEach(otherContent => {
                                if (otherContent !== content) {
                                    otherContent.style.display = 'none';
                                }
                            });
                        });
                    });
                    
                    // Set pagination links
                    document.querySelectorAll(".page-link").forEach(link => {
                        const pageNumber = link.dataset.page;
                        if (pageNumber) {
                            let newParams = new URLSearchParams(urlParams.toString());
                            newParams.set("page", pageNumber);  // Update page number in URL parameters
                            link.href = "?" + newParams.toString();  // Set href with all parameters
                        }
                    });
                    
                    // Restore checkbox selections
                    setCheckboxValues("monitors");
                    setCheckboxValues("directions");
                    
                    // Restore date and time inputs
                    setDateTimeInputs();
                    setInputValue("min_speed", 'input[name="min_speed"]');
                    setInputValue("max_speed", 'input[name="max_speed"]');

                    // Add reset filters functionality
                    document.getElementById("reset-filters").addEventListener("click", function() {
                        // Navigate to the base URL without any query parameters
                        window.location.href = "/bikedata";
                    });
                    
                    document.getElementById("apply-filters").addEventListener("click", function() {
                        let selectedMonitors = getSelectedValues('monitors');
                        let selectedDirections = getSelectedValues('directions');


                        let fromDate = formatTimestamp(
                            getInputValue('input[name="from_date"]'),
                            getInputValue('input[name="from_time"]')
                        );

                        let toDate = formatTimestamp(
                            getInputValue('input[name="to_date"]'),
                            getInputValue('input[name="to_time"]')
                        );

                        let minSpeed = getInputValue('input[name="min_speed"]');
                        let maxSpeed = getInputValue('input[name="max_speed"]');

                        

                        let queryParams = new URLSearchParams();
                        if (selectedMonitors.length) queryParams.append("monitors", selectedMonitors.join(","));
                        if (selectedDirections.length) queryParams.append("directions", selectedDirections.join(","));
                        if (fromDate) queryParams.append("from_date", fromDate);
                        if (toDate) queryParams.append("to_date", toDate);
                        if (minSpeed) queryParams.append("min_speed", minSpeed);
                        if (maxSpeed) queryParams.append("max_speed", maxSpeed);
                        
                        window.location.href = "/bikedata?" + queryParams.toString();
              
                    });
                    
                    // Set up graph button click handlers
                    document.getElementById('speed-graph').addEventListener('click', function() {
                        handleGraphButtonClick('speed');
                    });
                });

                // Helper functions
                function getInputValue(selector) {
                    const element = document.querySelector(selector);
                    return element ? element.value : '';  // Safeguard for missing elements
                }

                function formatTimestamp(date, time) {
                    if (!date) return '';  // Return empty string if no date
                    return `${date} ${time || '00:00'}:00`;  // Correctly use template literals
                }

                function getSelectedValues(name) {
                    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`))
                                .map(cb => cb.value);
                }

                function setCheckboxValues(name) {
                    const values = urlParams.get(name);
                    if (values) {
                        values.split(",").forEach(value => {
                            let checkbox = document.querySelector(`input[name="${name}"][value="${value}"]`);
                            if (checkbox) checkbox.checked = true;
                        });
                    }
                }

                function setDateTimeInputs() {
                    let fromDate = urlParams.get("from_date");
                    let toDate = urlParams.get("to_date");
                    
                    if (fromDate) {
                        // Parse the timestamp (format: YYYY-MM-DD HH:MM:SS)
                        let [datePart, timePart] = fromDate.split(' ');
                        document.querySelector('input[name="from_date"]').value = datePart;
                        if (timePart) {
                            document.querySelector('input[name="from_time"]').value = timePart.substring(0, 5); // Remove seconds
                        }
                    }
                    
                    if (toDate) {
                        // Parse the timestamp (format: YYYY-MM-DD HH:MM:SS)
                        let [datePart, timePart] = toDate.split(' ');
                        document.querySelector('input[name="to_date"]').value = datePart;
                        if (timePart) {
                            document.querySelector('input[name="to_time"]').value = timePart.substring(0, 5); // Remove seconds
                        }
                    }
                }

                // Graph functions
                function handleGraphButtonClick(graphType) {
                    // Get selected monitor
                    const selectedMonitor = document.querySelector('input[name="monitors_graph"]:checked');
                    
                    if (!selectedMonitor) {
                        alert("Please select a monitor first");
                        return;
                    }
                    
                    // Get date range filters if present
                    const fromDate = urlParams.get("from_date") || "";
                    const toDate = urlParams.get("to_date") || "";
                    
                    // Fetch data from the API
                    fetchGraphData(selectedMonitor.value, graphType, fromDate, toDate);
                }

                async function fetchGraphData(monitorId, graphType, fromDate, toDate) {
                    // Build the API URL
                    let apiUrl = `/api/graph-data-bike?monitor_id=${monitorId}&graph_type=${graphType}`;
                    if (fromDate) apiUrl += `&from_date=${fromDate}`;
                    if (toDate) apiUrl += `&to_date=${toDate}`;
                    
                    try {
                        const response = await fetch(apiUrl);
                        const data = await response.json();
                        
                        if (data.error) {
                            document.getElementById('chart').innerHTML = `<div style="text-align: center; color: red; padding: 50px;">${data.error}</div>`;
                            return;
                        }
                        
                        createPlotlyGraph(data, graphType);
                    } catch (error) {
                        document.getElementById('chart').innerHTML = `<div style="text-align: center; color: red; padding: 50px;">Error loading graph: ${error.message}</div>`;
                    }
                }

                function setInputValue(name, selector) {
                let value = urlParams.get(name);
                if (value) {
                    document.querySelector(selector).value = value;
                }
            }

                function createPlotlyGraph(data, graphType) {
                    // Configure graph based on type
                    let graphConfig = {
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { width: 2 }
                    };
                    
                    // Customize graph appearance based on type
                    switch(graphType.toLowerCase()) {
                        case 'soc':
                            graphConfig.line.color = 'rgb(46, 204, 113)';
                            break;
                        case 'failure':
                            graphConfig.mode = 'markers';
                            graphConfig.marker = { 
                                size: 10,
                                color: 'rgb(231, 76, 60)'
                            };
                            break;
                        case 'state':
                            graphConfig.mode = 'lines';
                            graphConfig.line = {
                                shape: 'hv',
                                color: 'rgb(52, 152, 219)'
                            };
                            
                            // Handle state mapping for y-axis ticks if provided
                            if (data.state_mapping && Object.keys(data.state_mapping).length > 0) {
                                data.layout = data.layout || {};
                                data.layout.yaxis = data.layout.yaxis || {};
                                data.layout.yaxis.tickmode = 'array';
                                data.layout.yaxis.tickvals = Object.keys(data.state_mapping).map(Number);
                                data.layout.yaxis.ticktext = Object.values(data.state_mapping);
                            }
                            break;
                    }
                    
                    // Create the plot
                    const layout = {
                        title: { text: data.title},
                        xaxis: {
                            title: {text: data.xaxis},
                            showgrid: true,
                            zeroline: false,
                            type: 'date',
                            tickformat: '%Y-%m-%d %H:%M'
                        },
                        yaxis: {
                            title: {text: data.yaxis},
                            showline: true,
                            showgrid: true
                        },
                        margin: { l: 60, r: 40, t: 80, b: 80 }
                    };
                    
                    // Merge with custom layout if provided
                    if (data.layout) {
                        Object.assign(layout, data.layout);
                    }
                    
                    const plotData = [{
                        x: data.time,
                        y: data.y_values,
                        ...graphConfig
                    }];
                    
                    Plotly.newPlot('chart', plotData, layout);
                }
        

    </script>
{% endblock %}
